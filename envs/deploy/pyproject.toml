[project]
name = "deploy-env"
version = "0.1.0"
description = "Deploy env B (vLLM serve only). Deliberately minimal and independent of the quant env: vLLM pins its own transformers/torch, and we do not want llmcompressor/lm-eval dragging in a different transformers that breaks serving."
requires-python = ">=3.10,<3.13"
dependencies = [
    "vllm>=0.11.0",                        # CUDA-12.8 wheel brings matching torch/transformers
    "huggingface-hub[hf-transfer]>=0.26",  # only need this to pull checkpoints
    "compressed-tensors>=0.10",            # vLLM reads this format; keep aligned with the quant env output
]

[tool.uv]
[tool.uv.pip]
